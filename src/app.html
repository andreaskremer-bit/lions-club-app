<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#1E4FA3" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/pwa-192.png" />
		<!-- Ohne diesen Verweis sieht iOS das Manifest nie und schreibt beim „Zum
		     Home-Bildschirm“ die gerade offene Adresse als feste Startadresse ins Icon
		     (bis 2026-11-05 fehlte er). Gesichert durch src/lib/pwaHead.test.ts. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="apple-mobile-web-app-title" content="Club-App" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
